name: Release

# Publishes prebuilt, self-contained builds so a site can be brought up without
# git, without the .NET SDK, and without waiting for a build on the target.
#
#   git tag v1.16.0 && git push origin v1.16.0
#
# Every target is cross-published from one Linux runner - self-contained publish
# needs no native toolchain for the target OS.
#
# The tarball layouts deliberately match what deploy/publish.sh and
# deploy/publish-pi-web.sh already produce, so the existing install.sh scripts
# work against a downloaded release unchanged.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.16.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # ---- Foundation web app -------------------------------------------------
      # linux-x64 for the Debian server, linux-arm64 for a LAN Pi. Layout mirrors
      # deploy/publish.sh: the app under ./foundation, with the unit file and
      # installer beside it.
      - name: Publish Foundation.Web (linux-x64)
        run: |
          dotnet publish web/Foundation.Web/Foundation.Web.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o out/web-x64/foundation -p:PublishSingleFile=false
          cp deploy/foundation.service deploy/install.sh out/web-x64/

      - name: Publish Foundation.Web (linux-arm64)
        run: |
          dotnet publish web/Foundation.Web/Foundation.Web.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -o out/web-arm64/foundation -p:PublishSingleFile=false
          cp deploy/foundation-pi.service out/web-arm64/
          cp deploy/install-pi-web.sh out/web-arm64/install.sh

      # ---- Kiosk print agent (Pi only) ---------------------------------------
      - name: Publish KioskPrintAgent (linux-arm64)
        run: |
          dotnet publish KioskPrintAgent/KioskPrintAgent.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -o out/kiosk-arm64/app -p:PublishSingleFile=false

      # ---- RFID card reader service ------------------------------------------
      # arm64 for a Pi, win-x64 because a card reader is often on the weigh PC
      # itself. install.sh picks up ./app and skips its build, same as the
      # scale reader's release path.
      - name: Publish RfidReaderService (linux-arm64)
        run: |
          dotnet publish RfidReaderService/RfidReaderService.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -o out/rfid-arm64/app -p:PublishSingleFile=false
          cp RfidReaderService/deploy/install.sh out/rfid-arm64/

      # The Windows package carries the installer, the double-clickable wrapper
      # and its own README, so a tech can unzip it on a customer PC and read
      # what to do without going back to GitHub - same layout as the scale
      # reader's win-x64 zip.
      - name: Publish RfidReaderService (win-x64)
        run: |
          dotnet publish RfidReaderService/RfidReaderService.csproj \
            -c Release -r win-x64 --self-contained true \
            -o out/rfid-win/app -p:PublishSingleFile=false
          cp RfidReaderService/deploy/install.ps1 RfidReaderService/deploy/INSTALL.bat out/rfid-win/
          cp RfidReaderService/deploy/package-README.txt out/rfid-win/README.txt

      # ---- Gate controller service (Pi only) ---------------------------------
      # arm64 only, deliberately: this service exists to drive GPIO, and there
      # is no GPIO header on a Windows scale house PC.
      - name: Publish GateControllerService (linux-arm64)
        run: |
          dotnet publish GateControllerService/GateControllerService.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -o out/gate-arm64/app -p:PublishSingleFile=false
          cp GateControllerService/deploy/install.sh out/gate-arm64/
          cp GateControllerService/deploy/package-README.txt out/gate-arm64/README.txt

      - name: Assemble packages
        run: |
          set -euo pipefail
          chmod +x out/web-x64/install.sh out/web-arm64/install.sh out/rfid-arm64/install.sh
          chmod +x out/gate-arm64/install.sh out/gate-arm64/app/GateControllerService
          chmod +x out/web-x64/foundation/Foundation.Web out/web-arm64/foundation/Foundation.Web
          chmod +x out/kiosk-arm64/app/KioskPrintAgent out/rfid-arm64/app/RfidReaderService

          tar -czf foundation-web-linux-x64.tar.gz     -C out/web-x64 .
          tar -czf foundation-web-linux-arm64.tar.gz   -C out/web-arm64 .
          tar -czf kiosk-print-agent-linux-arm64.tar.gz -C out/kiosk-arm64 .
          tar -czf rfid-reader-linux-arm64.tar.gz      -C out/rfid-arm64 .
          tar -czf gate-controller-linux-arm64.tar.gz  -C out/gate-arm64 .
          (cd out/rfid-win && zip -qr ../../rfid-reader-win-x64.zip .)

          ls -lh foundation-web-*.tar.gz kiosk-*.tar.gz rfid-* gate-*.tar.gz

      - name: Check the packages
        run: |
          set -euo pipefail
          # Verify what we think we built, rather than finding out on a customer's server.
          test -f out/web-x64/foundation/Foundation.Web     || { echo "x64 web binary missing";   exit 1; }
          test -f out/web-arm64/foundation/Foundation.Web   || { echo "arm64 web binary missing"; exit 1; }
          test -f out/web-x64/install.sh                    || { echo "x64 installer missing";    exit 1; }
          test -f out/web-arm64/install.sh                  || { echo "arm64 installer missing";  exit 1; }
          test -f out/kiosk-arm64/app/KioskPrintAgent       || { echo "kiosk binary missing";     exit 1; }
          test -f out/rfid-arm64/app/RfidReaderService      || { echo "rfid binary missing";      exit 1; }
          test -f out/rfid-win/app/RfidReaderService.exe    || { echo "rfid exe missing";         exit 1; }
          test -f out/gate-arm64/app/GateControllerService  || { echo "gate binary missing";      exit 1; }
          test -f out/gate-arm64/install.sh                 || { echo "gate installer missing";   exit 1; }

          # A package with no installer in it is worse than a failed build: it
          # looks complete right up to the moment someone unzips it on site.
          test -f out/rfid-win/install.ps1                  || { echo "rfid installer missing";   exit 1; }
          test -f out/rfid-win/INSTALL.bat                  || { echo "rfid wrapper missing";     exit 1; }
          test -f out/rfid-win/README.txt                   || { echo "rfid README missing";      exit 1; }
          test -f out/gate-arm64/README.txt                 || { echo "gate README missing";      exit 1; }

          # A database must never ship - it would overwrite a site's own data.
          if find out -name "*.db" -o -name "*.db-wal" -o -name "*.db-shm" | grep -q .; then
            echo "::error::A database file leaked into a package."
            find out -name "*.db*"
            exit 1
          fi

          # Cross-published binaries must actually be for the target architecture.
          file out/web-arm64/foundation/Foundation.Web | grep -q "ARM aarch64" \
            || { echo "::error::arm64 web build is not an aarch64 binary"; exit 1; }
          file out/web-x64/foundation/Foundation.Web | grep -q "x86-64" \
            || { echo "::error::x64 web build is not an x86-64 binary"; exit 1; }
          file out/gate-arm64/app/GateControllerService | grep -q "ARM aarch64" \
            || { echo "::error::gate build is not an aarch64 binary"; exit 1; }
          echo "Packages OK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          NOTES=$(cat <<EOF
          Prebuilt, self-contained builds. No .NET, no SDK and no git needed on
          the target machine.

          ## Foundation web app

          Debian server:

          \`\`\`
          curl -fsSL -o web.tar.gz https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/foundation-web-linux-x64.tar.gz
          mkdir -p /tmp/fw && tar -xzf web.tar.gz -C /tmp/fw
          sudo DOMAIN=your.domain.com EMAIL=you@example.com bash /tmp/fw/install.sh
          \`\`\`

          Raspberry Pi: same, with \`foundation-web-linux-arm64.tar.gz\`.

          Omit DOMAIN/EMAIL for a LAN install without Let's Encrypt. The database
          is preserved across reinstalls.

          ## Kiosk print agent (Pi)

          \`kiosk-print-agent-linux-arm64.tar.gz\`

          ## RFID card reader service

          Reads HID / prox cards from an RS-232 reader and reports each
          presentation to the web app. Usually a Pi beside a kiosk, but the
          reader is often wired to the weigh PC instead — hence both builds.

          ### Windows

          Download \`rfid-reader-win-x64.zip\`, unzip it, then from an
          **admin** command prompt in that folder:

          \`\`\`
          INSTALL.bat https://your-web-app-url -SerialPort COM3
          \`\`\`

          Installs the service with automatic startup, keeps the existing
          database, and applies the web app URL. Re-run the same command to
          update. \`-SerialPort\` is optional — leave it out and add the reader
          from the web app instead. Add \`-ResetDb\` to start from a clean
          database.

          On a PC that also runs the Web Print Service, add \`-Port 5231\`:
          both default to 5230, and the second one to start fails to bind.

          ### Raspberry Pi (64-bit, Pi 4/5)

          \`\`\`
          curl -fsSL -o rrs.tar.gz https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/rfid-reader-linux-arm64.tar.gz
          mkdir -p /tmp/rrs && tar -xzf rrs.tar.gz -C /tmp/rrs
          bash /tmp/rrs/install.sh https://your-web-app-url --service-id kiosk-1
          \`\`\`

          Then map the kiosk to \`<service-id>:<reader-id>\` on the web app,
          under **Setup → Options → Card Readers**.

          ## Gate controller service

          Drives a gate relay and/or a light when a ticket completes, releasing
          once the truck drives off the scale or a timeout expires.

          ### Raspberry Pi (64-bit, Pi 4/5)

          \`\`\`
          curl -fsSL -o gate.tar.gz https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/gate-controller-linux-arm64.tar.gz
          mkdir -p /tmp/gcs && tar -xzf gate.tar.gz -C /tmp/gcs
          bash /tmp/gcs/install.sh https://your-web-app-url --service-id north-gate
          \`\`\`

          Then add the gates wired to that Pi at \`http://<pi>:5240/\`, and set
          each Scale's **Gate** on the web app to \`<service-id>:<gate-id>\`.
          Prove the wiring before a truck is involved:

          \`\`\`
          curl -X POST http://<pi>:5240/api/gates/gate-1/test
          \`\`\`

          ### Windows

          There is no Windows build, and there will not be one. This service
          exists to drive relays on the GPIO header, and a scale house PC has
          no GPIO.

          ## Scale reader service

          Released separately, from its own repo:
          https://github.com/GTMichelli-Dev/scale-reader-service/releases/latest

          ---

          The URL you pass an installer must match the web app's real scheme
          and port — a wrong one leaves the service reconnecting forever. Every
          installer is safe to re-run: that is also how you update, and the
          database is preserved.

          The RFID and gate archives carry a \`README.txt\` covering options,
          ports and what to check when something is wrong.
          EOF
          )

          gh release create "v$V" \
            --title "v$V" \
            --notes "$NOTES" \
            foundation-web-linux-x64.tar.gz \
            foundation-web-linux-arm64.tar.gz \
            kiosk-print-agent-linux-arm64.tar.gz \
            rfid-reader-linux-arm64.tar.gz \
            rfid-reader-win-x64.zip \
            gate-controller-linux-arm64.tar.gz
